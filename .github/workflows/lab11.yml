name: Lab 11

on:
  push:
    paths:
      - ".github/workflows/lab11.yml"
      - "Labs/Obj_detection/Lab11/**"
  workflow_dispatch:

jobs:
  lab11:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Labs/Obj_detection/Lab11/requirements.txt nbconvert
      - name: Generate labels, dataset, quality report and augmentation
        env:
          NO_ALBUMENTATIONS_UPDATE: "1"
        run: python Labs/Obj_detection/Lab11/run_lab11.py
      - name: Run the professor's Lab 11 notebook
        env:
          NO_ALBUMENTATIONS_UPDATE: "1"
        working-directory: Labs/Obj_detection/Lab11
        run: |
          jupyter nbconvert --to notebook --execute lab11_labeling_augmentation.ipynb --output lab11_executed.ipynb --ExecutePreprocessor.timeout=1200
      - name: Commit produced Lab 11 outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Labs/Obj_detection/Lab11/results/ Labs/Obj_detection/Lab11/work/manual_labels/
          if ! git diff --cached --quiet; then
            git commit -m "lab11"
            git push
          fi
      - name: Upload complete experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab11-results
          path: |
            Labs/Obj_detection/Lab11/results/
            Labs/Obj_detection/Lab11/work/manual_labels/
            Labs/Obj_detection/Lab11/work/labeling_practice/
            Labs/Obj_detection/Lab11/work/pennfudan_yolo/
            Labs/Obj_detection/Lab11/work/pennfudan_yolo_augmented/
            Labs/Obj_detection/Lab11/lab11_executed.ipynb
          if-no-files-found: warn
