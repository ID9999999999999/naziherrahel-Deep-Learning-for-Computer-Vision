name: Lab 11

on:
  push:
    paths:
      - ".github/workflows/lab11.yml"
      - "Labs/Obj_detection/Lab11/**"
  workflow_dispatch:

jobs:
  lab11:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Labs/Obj_detection/Lab11/requirements.txt nbconvert
      - name: Run Lab 11 notebook
        env:
          NO_ALBUMENTATIONS_UPDATE: "1"
        working-directory: Labs/Obj_detection/Lab11
        run: |
          jupyter nbconvert --to notebook --execute lab11_labeling_augmentation.ipynb --output lab11_executed.ipynb --ExecutePreprocessor.timeout=1200
      - name: Upload executed notebook and dataset summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab11-results
          path: |
            Labs/Obj_detection/Lab11/lab11_executed.ipynb
            Labs/Obj_detection/Lab11/work/pennfudan_yolo/data.yaml
            Labs/Obj_detection/Lab11/work/pennfudan_yolo_augmented/data.yaml
          if-no-files-found: warn
